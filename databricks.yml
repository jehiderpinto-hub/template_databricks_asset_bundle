bundle:
  name: template_databricks_asset_bundle

# Permite escanear subcarpetas dentro de resources/ (genie_spaces, jobs, pipelines, etc.)
include:
  - "resources/*.yml"
  - "resources/**/*.yml"

sync:
  include:
    - "genie_assessment/temp/config.json"
    - "src/notebooks/**"

# --- Declaración Global de Variables ---
variables:

  assessment_warehouse_id:
    description: "ID del SQL Warehouse usado por el assessment"

  genie_parent_path:
    description: "Ruta padre de los Genie Spaces"

  genie_space_warehouse_id:
    description: "ID del SQL Warehouse asignado para ejecutar Genie Spaces"

  genie_space_parent_path:
    description: "Ruta base dentro del Workspace para guardar Genie Spaces"

  genie_space_demo_genie_warehouse_id:
    description: "ID del SQL Warehouse asignado para ejecutar el Genie Space demo_genie"

# --- Definición de Entornos (Targets) ---
targets:
  # 1. Entorno de Desarrollo Local / Sandbox
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-2339714903823198.18.azuredatabricks.net
      profile: dev
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      assessment_warehouse_id: 6fadc34945c1c177
      genie_parent_path: "/Workspace/Users/${workspace.current_user.userName}/GenieSpaces"
      genie_space_warehouse_id: 6fadc34945c1c177
      genie_space_demo_genie_warehouse_id: 6fadc34945c1c177
      genie_space_parent_path: "/Workspace/Users/${workspace.current_user.userName}/GenieSpaces"
    presets:
      artifacts_dynamic_version: true # Agrega timestamps a los artefatos para evitar colisiones en dev