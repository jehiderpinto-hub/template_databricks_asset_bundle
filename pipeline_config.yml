benchmarks:
  questions:

    - id: ""
      question:
        - "¿Dame los últimos chequeos de precios en la ciudad de Tatumbla?"
      answer:
        - format: "SQL"
          content: |
            SELECT *
            FROM gld_star_prod.hon.vw_chequeo_precio_inventario_hon
            WHERE Municipio = 'TATUMBLA'
            ORDER BY Fecha_Creacion DESC
            LIMIT 10;
      evaluation_note:
        - "Debe devolver una tabla con las columnas Nombre_Propietario, Codigo_Cliente, Fecha_Creacion, Proveedor, Marca, Precio_Flete, Precio_Compra y Precio_Venta."

    - id: ""
      question:
        - "¿Cuál es el flete por bolsa más económico de todos?"
      answer:
        - format: "SQL"
          content: |
            SELECT
              CLIENTE,
              NOMBRE,
              Centro,
              DEPARTAMENTO,
              POBLACION,
              FLETE AS flete_mas_economico
            FROM gld_star_dev.star_generico.tabladescuentos
            WHERE FLETE IS NOT NULL
              AND FLETE > 0
            ORDER BY FLETE ASC
            LIMIT 2;
      evaluation_note:
        - "Debe devolver una tabla con dos registro y las columnas CLIENTE, NOMBRE, Centro, DEPARTAMENTO, POBLACION y FLETE."

    - id: ""
      question:
        - "¿Cuál es el top 5 de clientes con mayor descuento por dirección general?"
      answer:
        - format: "SQL"
          content: |
            SELECT
              CLIENTE,
              NOMBRE,
              CODIGO_PRODUCTO,
              ABS(DCTO_DIR_GNRAL) AS DCTO_DIR_GNRAL,
              ROUND(
                ABS(DCTO_DIR_GNRAL) / NULLIF(PRECIO_FINAL, 0) * 100,
                2
              ) AS PCT_DCTO_DIR_GNRAL
            FROM gld_star_dev.star_generico.tabladescuentos
            WHERE DCTO_DIR_GNRAL <> 0
              AND PRECIO_FINAL <> 0
              AND CLIENTE <> '#'
            ORDER BY PCT_DCTO_DIR_GNRAL DESC
            LIMIT 5;
      evaluation_note:
        - "Debe devolver una tabla con cinco registros y las columnas CLIENTE, NOMBRE, CODIGO_PRODUCTO, DCTO_DIR_GNRAL y PCT_DCTO_DIR_GNRAL."

    - id: ""
      question:
        - "¿Cuál es el cliente que tiene un descuento más bajo comparado con todos los de su mismo grupo (Subsegmento, Departamento, Municipio, Material)?"
      answer:
        - format: "SQL"
          content: |
            WITH descuentos AS (
              SELECT
                CLIENTE,
                NOMBRE,
                SUBSEGMENTO_CLIENTES,
                DEPARTAMENTO,
                POBLACION,
                Material,
                CODIGO_PRODUCTO,
                PRECIO_BRUTO,
                PRECIO_FINAL,
                CASE
                  WHEN PRECIO_BRUTO <> 0
                    THEN PRECIO_FINAL / PRECIO_BRUTO
                  ELSE NULL
                END AS RATIO_DESCUENTO
              FROM gld_star_dev.star_generico.tabladescuentos
              WHERE CLIENTE <> '#'
                AND PRECIO_BRUTO <> 0
            ),
            con_grupo AS (
              SELECT
                *,
                AVG(RATIO_DESCUENTO) OVER (
                  PARTITION BY SUBSEGMENTO_CLIENTES, DEPARTAMENTO, POBLACION, Material
                ) AS RATIO_PROMEDIO_GRUPO,
                RATIO_DESCUENTO -
                AVG(RATIO_DESCUENTO) OVER (
                  PARTITION BY SUBSEGMENTO_CLIENTES, DEPARTAMENTO, POBLACION, Material
                ) AS DIFERENCIA_VS_GRUPO
              FROM descuentos
            ),
            sin_duplicados AS (
              SELECT
                CLIENTE,
                NOMBRE,
                SUBSEGMENTO_CLIENTES,
                DEPARTAMENTO,
                POBLACION,
                Material,
                CODIGO_PRODUCTO,
                ROUND(AVG(PRECIO_BRUTO), 2) AS PRECIO_BRUTO,
                ROUND(AVG(PRECIO_FINAL), 2) AS PRECIO_FINAL,
                ROUND(AVG(RATIO_DESCUENTO) * 100, 2) AS PCT_PRECIO_FINAL_VS_BRUTO,
                ROUND(AVG(RATIO_PROMEDIO_GRUPO) * 100, 2) AS PCT_PROMEDIO_GRUPO,
                ROUND(AVG(DIFERENCIA_VS_GRUPO) * 100, 2) AS DIFERENCIA_VS_GRUPO_PP
              FROM con_grupo
              GROUP BY
                CLIENTE,
                NOMBRE,
                SUBSEGMENTO_CLIENTES,
                DEPARTAMENTO,
                POBLACION,
                Material,
                CODIGO_PRODUCTO
            )
            SELECT *
            FROM sin_duplicados
            ORDER BY DIFERENCIA_VS_GRUPO_PP DESC
            LIMIT 5;
      evaluation_note:
        - "Devuelve una tabla con los 5 clientes de referencia para comparación con clientes similares."

    - id: ""
      question:
        - "Dame el precio promedio ponderado de las ventas realizadas el mes pasado (Agosto 2026) a nivel de Presentación y Tipo de Negocio."
      answer:
        - format: "SQL"
          content: |
            SELECT
              TIPO_DE_NEGOCIO,
              SUM(
                CASE
                  WHEN PRESENTACION = 'SACOS'
                  THEN VALOR_NETO_PRODUCTO
                END
              ) /
              NULLIF(
                SUM(
                  CASE
                    WHEN PRESENTACION = 'SACOS'
                    THEN TONELADAS
                  END
                ),
                0
              ) AS SACOS,
              SUM(
                CASE
                  WHEN PRESENTACION = 'GRANEL'
                  THEN VALOR_NETO_PRODUCTO
                END
              ) /
              NULLIF(
                SUM(
                  CASE
                    WHEN PRESENTACION = 'GRANEL'
                    THEN TONELADAS
                  END
                ),
                0
              ) AS GRANEL
            FROM gld_consumption_3as_prod_hon_db.sd.zqry_zsdm03_009_hn
            WHERE COD_PERIODO = '08/2026'
              AND TIPO_DE_NEGOCIO IN ('Masivo', 'Industrial')
              AND MICROMERCADO <> 'Honduras Exportacion'
            GROUP BY TIPO_DE_NEGOCIO
            ORDER BY TIPO_DE_NEGOCIO;
      evaluation_note:
        - "Devuelve una tabla con las columnas TIPO_DE_NEGOCIO, SACOS y GRANEL. Debe incluir una nota indicando que se excluyeron los registros de Honduras Exportacion."

instructions:
  example_question_sqls:
    - id: ""
      question:
        - "¿Cuál es el precio FOB por subsegmento de cliente, material y empaque?"
      sql:
        - |
          SELECT
            SubsegmentoDestinatario,
            Material,
            EmpaqueDeProducto,
            SUM(IngresoFob) AS IngresoFob_Total,
            SUM(CantidadVendidaFacturada) AS Cantidad_Total,
            ROUND(TRY_DIVIDE(SUM(IngresoFob), SUM(CantidadVendidaFacturada)), 2) AS PrecioFOB
          FROM brz_dev.star_generico.rentabilidad_honduras
          WHERE Per = '2026.06'
          GROUP BY SubsegmentoDestinatario, Material, EmpaqueDeProducto
          ORDER BY SubsegmentoDestinatario, Material, EmpaqueDeProducto
      usage_guidance:
        - "Usar para calcular precio FOB unitario a partir de rentabilidad_honduras. El precio FOB no es una columna: se obtiene dividiendo SUM(IngresoFob) entre SUM(CantidadVendidaFacturada), siempre con TRY_DIVIDE para evitar división por cero. Nunca promediar precios ya calculados por fila. Si no se define la ventana de fecha en la pregunta, devuelve la consulta para el ultimo mes registrado. La columna Per filtra el periodo en formato 'AAAA.MM'; cambiar ese valor para otros meses. Aplicable a cualquier combinación de agrupación (subsegmento, material, empaque, departamento, planta). La respuesta final debe dar explicito el filtro de fecha usado"
              
  text_instructions:
    - id: ""
      content:
        - |
          RENTABILIDAD SOBRE FACTURACIÓN. Usa brz_dev.star_generico.rentabilidad_honduras, que ya
          trae la facturación con su costo al grano de factura. No rehagas el join
          contra gld_consumption_3as_prod_hon_db.sd.zqry_zsdm03_009_hn.
          Los indicadores de volumen, ingreso FOB y precio se calculan sobre TODAS
          las filas. Los de costo, rentabilidad y margen SOLO sobre TIENE_COSTO = true,
          y en ese caso declara siempre qué porcentaje del volumen y del ingreso
          quedó cubierto por costo. Nunca presentes un margen consolidado sin
          declarar esa cobertura.

