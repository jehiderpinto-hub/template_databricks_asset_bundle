# This is a Declarative Automation Bundle definition for template_databricks_asset_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: template_databricks_asset_bundle
  uuid: 9804a657-b980-46c6-a1e8-23a460beb77d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-2339714903823198.18.azuredatabricks.net
    variables:
      catalog: hive_metastore
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-2339714903823198.18.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/josorioos@argos.com.co to make sure we only have a single copy.
      root_path: /Workspace/Users/josorioos@argos.com.co/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hive_metastore
      schema: prod
    permissions:
      - user_name: josorioos@argos.com.co
        level: CAN_MANAGE
