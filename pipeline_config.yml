sources:

 - "brz_dev.star_generico.rentabilidad_honduras"
 - "gld_star_prod.hon.vw_chequeo_precio_inventario_hon"
 - "gld_star_dev.hon.tabladescuentos"



benchmarks:
  questions:
    - id: ""
      question:
        - "¿Dame los ultimos chequeos de precios en la ciudad de Tatumbla?"
      answer:
        - format: "SQL"
          content:
            SELECT *
            FROM gld_star_prod.hon.vw_chequeo_precio_inventario_hon
            WHERE Municipio = 'TATUMBLA'
            ORDER BY Fecha_Creacion DESC
            LIMIT 10;
      evaluation_note:
        - "Debe devolver una tabla con las columnas Nombre_Propietario, Codigo_Cliente, Fecha_Creacion, Proveedor, Marca, Precio_Flete, Precio_Compra, Precio_Venta"

instruccions:
  example_question_sqls:
    - id: ""
      question:
        - "Pregunta de ejemplo"
      sql:
        - "SELECT 1"
      usageguidance:
        - "Cuándo usar esta query"
