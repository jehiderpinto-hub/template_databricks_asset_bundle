    clone_mia:
      title: (Clone) MIA
      warehouse_id: 6fadc34945c1c177
      file_path: ../../src/genie_spaces/clone_mia.geniespace.json
      description: 'Este agente ayuda al asesor comercial a entender el desempeño
        de sus clientes y tomar mejores decisiones con base en datos.


        Permite consultar ventas, volumen, precio, rentabilidad, descuentos, apoyos
        comerciales, visitas, inventarios y precios de la competencia por cliente,
        producto, zona o periodo.


        Puedes utilizarlo para:


        - Revisar cuánto compra un cliente y cómo ha evolucionado.

        - Comparar su precio actual con el mes anterior.

        - Identificar descuentos, cambios de precio y rentabilidad.

        - Dar seguimiento a apoyos aprobados, entregados o pendientes.

        - Comparar los precios de Argos con la competencia.

        - Detectar clientes con caída de volumen o baja frecuencia de compra.

        - Identificar puntos de venta sin visitas recientes.

        - Encontrar oportunidades para recuperar volumen, proteger precio o mejorar
        el mix.


        Las respuestas incluyen un resumen fácil de entender, los principales hallazgos,
        alertas y acciones recomendadas. Para obtener mejores resultados, indica el
        cliente, código, zona y periodo que deseas analizar.'
      parent_path: /Workspace/Users/josorioos@argos.com.co
