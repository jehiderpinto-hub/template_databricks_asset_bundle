version: 1.1

source: brz_dev.default.fact_sales_demo_genie

joins:
  - name: dim_date
    source: brz_dev.default.dim_date_demo_genie
    "on": source.date_id = dim_date.date_id
  - name: dim_customer
    source: brz_dev.default.dim_customer_demo_genie
    "on": source.customer_id = dim_customer.customer_id
  - name: dim_product
    source: brz_dev.default.dim_product_demo_genie
    "on": source.product_id = dim_product.product_id

comment: "Vista semántica central de ventas. Combina la tabla de hechos de ventas con las dimensiones de fecha, cliente y producto para responder preguntas sobre ingresos, descuentos, unidades vendidas y órdenes a lo largo del tiempo y por segmento de cliente o categoría de producto."

dimensions:
  - name: Año
    expr: dim_date.year
    comment: "Año calendario en que se realizó la venta."
    synonyms:
      - year
      - anio
  - name: Mes Número
    expr: dim_date.month
    comment: "Número del mes (1-12) en que se realizó la venta."
    synonyms:
      - month number
      - numero de mes
  - name: Mes Nombre
    expr: dim_date.month_name
    comment: "Nombre del mes en que se realizó la venta."
    synonyms:
      - month name
      - nombre mes
  - name: Fecha
    expr: source.date_id
    comment: "Fecha exacta en que se realizó la orden."
    synonyms:
      - date
      - order date
  - name: ID Cliente
    expr: source.customer_id
    comment: "Identificador único del cliente."
    synonyms:
      - customer id
      - cliente id
  - name: Nombre Cliente
    expr: dim_customer.customer_name
    comment: "Nombre completo del cliente."
    synonyms:
      - customer name
      - cliente
  - name: Segmento de Mercado
    expr: dim_customer.market_segment
    comment: "Segmento de mercado al que pertenece el cliente."
    synonyms:
      - market segment
      - segmento
  - name: ID Producto
    expr: source.product_id
    comment: "Identificador único del producto."
    synonyms:
      - product id
      - producto id
  - name: Nombre Producto
    expr: dim_product.product_name
    comment: "Nombre descriptivo del producto vendido."
    synonyms:
      - product name
      - producto
  - name: Marca
    expr: dim_product.brand
    comment: "Marca comercial del producto."
    synonyms:
      - brand
      - marca producto
  - name: Tipo Producto
    expr: dim_product.product_type
    comment: "Tipo o categoría del producto."
    synonyms:
      - product type
      - categoria
  - name: Fabricante
    expr: dim_product.manufacturer
    comment: "Fabricante del producto."
    synonyms:
      - manufacturer
      - proveedor
  - name: ID Orden
    expr: source.order_id
    comment: "Identificador de la orden de venta."
    synonyms:
      - order id
      - orden
  - name: Número de Línea
    expr: source.line_number
    comment: "Número de línea dentro de la orden."
    synonyms:
      - line number
      - linea

measures:
  - name: Ventas Netas
    expr: SUM(net_sales)
    comment: "Suma del valor neto de ventas después de aplicar descuentos."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - net sales
      - ingresos netos
  - name: Ventas Brutas
    expr: SUM(gross_sales)
    comment: "Suma del valor bruto de ventas antes de aplicar descuentos."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - gross sales
      - ingresos brutos
  - name: Descuento Total
    expr: SUM(discount)
    comment: "Suma total de descuentos aplicados."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - total discount
      - descuentos
  - name: Descuento Promedio
    expr: AVG(discount)
    comment: "Descuento promedio aplicado por línea de venta. Útil para analizar el descuento promedio por cliente o producto."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - average discount
      - promedio descuento
  - name: Diferencia Bruto vs Neto
    expr: SUM(gross_sales) - SUM(net_sales)
    comment: "Diferencia entre ventas brutas y ventas netas, equivalente al total de descuentos aplicados."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - discount gap
      - diferencia ventas
  - name: Unidades Vendidas
    expr: SUM(quantity)
    comment: "Total de unidades vendidas."
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - quantity sold
      - cantidad vendida
  - name: Número de Órdenes
    expr: COUNT(DISTINCT order_id)
    comment: "Cantidad de órdenes únicas realizadas."
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - order count
      - total ordenes
  - name: Ingreso Neto Promedio por Orden
    expr: SUM(net_sales) / COUNT(DISTINCT order_id)
    comment: "Ingreso neto promedio generado por cada orden única."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - average net revenue per order
      - ticket promedio
  - name: Número de Líneas de Venta
    expr: COUNT(*)
    comment: "Total de líneas de producto en las órdenes de venta."
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - line count
      - lineas de orden