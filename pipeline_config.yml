  - "¿Dame el precio promedio ponderado de las ventas realizadas el mes pasado (Julio 2026)?"
  - "¿Clientes que tuvieron un caida en las ventas en el mes de Julio 2026?"
  - "¿Cual es el subsegmento que representa el mayor ingreso para el YTD (lo que va del año)?"
