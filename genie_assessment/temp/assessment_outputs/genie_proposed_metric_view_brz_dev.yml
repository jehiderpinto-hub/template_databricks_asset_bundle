version: 1.1

source: brz_dev.default.fact_sales_demo_genie

joins:
  - name: dim_customer
    source: brz_dev.default.dim_customer_demo_genie
    "on": source.customer_id = dim_customer.customer_id

comment: "Vista semántica central de ventas. Cada fila representa una línea de producto dentro de una orden. Permite analizar ventas brutas, netas, descuentos y conteo de órdenes por producto, cliente, segmento de mercado y fecha."

dimensions:
  - name: Product ID
    expr: source.product_id
    comment: "Identificador del producto vendido. Úsalo para agrupar ventas por producto."
    synonyms:
      - producto
      - id producto
  - name: Order ID
    expr: source.order_id
    comment: "Identificador de la orden de venta."
    synonyms:
      - orden
      - id orden
  - name: Line Number
    expr: source.line_number
    comment: "Número de línea dentro de la orden."
    synonyms:
      - línea
      - línea de orden
  - name: Date
    expr: source.date_id
    comment: "Fecha en la que se realizó la orden."
    synonyms:
      - fecha
      - fecha de venta
  - name: Customer ID
    expr: source.customer_id
    comment: "Identificador único del cliente."
    synonyms:
      - cliente id
      - id cliente
  - name: Customer Name
    expr: dim_customer.customer_name
    comment: "Nombre completo del cliente."
    synonyms:
      - nombre cliente
      - cliente
  - name: Market Segment
    expr: dim_customer.market_segment
    comment: "Segmento de mercado al que pertenece el cliente. Úsalo para agrupar órdenes y ventas por segmento."
    synonyms:
      - segmento
      - segmento de mercado
  - name: Nation ID
    expr: dim_customer.nation_id
    comment: "Identificador de la nación del cliente."
    synonyms:
      - nación
      - país id

measures:
  - name: Gross Sales
    expr: SUM(source.gross_sales)
    comment: "Suma del valor bruto de ventas antes de aplicar descuentos."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - ventas brutas
      - venta bruta
  - name: Net Sales
    expr: SUM(source.net_sales)
    comment: "Suma del valor neto de ventas después de aplicar descuentos."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - ventas netas
      - venta neta
  - name: Total Discount
    expr: SUM(source.discount)
    comment: "Suma total de descuentos aplicados."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - descuento total
      - descuentos
  - name: Total Quantity
    expr: SUM(source.quantity)
    comment: "Suma total de unidades vendidas."
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - cantidad total
      - unidades vendidas
  - name: Number of Orders
    expr: COUNT(DISTINCT source.order_id)
    comment: "Conteo de órdenes únicas. Úsalo para responder cuántas órdenes existen por segmento u otra dimensión."
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - órdenes
      - total órdenes
  - name: Number of Order Lines
    expr: COUNT(*)
    comment: "Conteo de líneas de orden (filas en la tabla de hechos)."
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - líneas de orden
      - registros de venta