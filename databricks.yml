bundle:
  name: template_databricks_asset_bundle

# Permite escanear subcarpetas dentro de resources/ (genie_spaces, jobs, pipelines, etc.)
include:
  - "resources/*.yml"
  - "resources/**/*.yml"

# --- Declaración Global de Variables ---
variables:

  genie_space_warehouse_id:
    description: "ID del SQL Warehouse asignado para ejecutar Genie Spaces"

  genie_space_parent_path:
    description: "Ruta base dentro del Workspace para guardar Genie Spaces"

# --- Definición de Entornos (Targets) ---
targets:
  # 1. Entorno de Desarrollo Local / Sandbox
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-2339714903823198.18.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      genie_space_warehouse_id: 6fadc34945c1c177
      genie_space_parent_path: "/Workspace/Users/${workspace.current_user.userName}/GenieSpaces"
    presets:
      artifacts_dynamic_version: true # Agrega timestamps a los artefatos para evitar colisiones en dev